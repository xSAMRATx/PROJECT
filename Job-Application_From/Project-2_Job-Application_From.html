<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
    <link rel="stylesheet" href="Project-2_Job-Application_From.css">

    <meta name="description" content="Job application form with plain JavaScript validation, built by Aziz Samrat.">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
    <a class="back-to-gallery" href="../index.html">&larr; All designs</a>

<main class="container">
    <div class="application">

        <div class="h">
            <h1>JOB APPLICATION <samp class="small">(Web)</samp></h1>
            <p class="form-note">Fields marked with <span class="req" aria-hidden="true">*</span> are required.</p>
        </div>

        <div class="success" id="success" role="status" aria-live="polite" hidden>
            <strong>Thank you!</strong> Your application was submitted. This is a demo form, so nothing was actually sent.
        </div>

        <form id="job-form" novalidate>
            <div class="from-container">

                <div class="from-control">
                    <label for="first-name">First name <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="first-name" name="first_name" placeholder="Enter first name..." autocomplete="given-name" required minlength="2" aria-describedby="first-name-error">
                    <small class="error" id="first-name-error"></small>
                </div>

                <div class="from-control">
                    <label for="last-name">Last name <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="last-name" name="last_name" placeholder="Enter last name..." autocomplete="family-name" required minlength="2" aria-describedby="last-name-error">
                    <small class="error" id="last-name-error"></small>
                </div>

                <div class="from-control">
                    <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required aria-describedby="email-error">
                    <small class="error" id="email-error"></small>
                </div>

                <div class="from-control">
                    <label for="phone">Phone <span class="req" aria-hidden="true">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="+880 1XXX-XXXXXX" autocomplete="tel" required aria-describedby="phone-error">
                    <small class="error" id="phone-error"></small>
                </div>

                <div class="from-control">
                    <label for="job-role">Job role <span class="req" aria-hidden="true">*</span></label>
                    <select id="job-role" name="job_role" required aria-describedby="job-role-error">
                        <option value="">Select job role</option>
                        <option value="frontend">Frontend Developer</option>
                        <option value="backend">Backend Developer</option>
                        <option value="fullstack">Full Stack Developer</option>
                        <option value="uiux">UI/UX Designer</option>
                    </select>
                    <small class="error" id="job-role-error"></small>
                </div>

                <div class="from-control">
                    <label for="start-date">Available from <span class="req" aria-hidden="true">*</span></label>
                    <input type="date" id="start-date" name="start_date" required aria-describedby="start-date-error">
                    <small class="error" id="start-date-error"></small>
                </div>

                <fieldset class="textarea-control radio-group" aria-describedby="experience-error">
                    <legend>Experience <span class="req" aria-hidden="true">*</span></legend>
                    <label class="inline"><input type="radio" name="experience" value="0-1" required> 0-1 years</label>
                    <label class="inline"><input type="radio" name="experience" value="1-3"> 1-3 years</label>
                    <label class="inline"><input type="radio" name="experience" value="3+"> 3+ years</label>
                    <small class="error" id="experience-error"></small>
                </fieldset>

                <div class="textarea-control">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter address here (optional)"></textarea>
                </div>

                <div class="from-control">
                    <label for="city">City <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="city" name="city" placeholder="Enter city name..." autocomplete="address-level2" required aria-describedby="city-error">
                    <small class="error" id="city-error"></small>
                </div>

                <div class="from-control">
                    <label for="postcode">Postcode</label>
                    <input type="text" id="postcode" name="postcode" placeholder="e.g. 1207" inputmode="numeric" autocomplete="postal-code" aria-describedby="postcode-error">
                    <small class="error" id="postcode-error"></small>
                </div>

                <div class="textarea-control">
                    <label for="cv">Upload your CV <span class="req" aria-hidden="true">*</span></label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required aria-describedby="cv-hint cv-error">
                    <small class="hint" id="cv-hint">PDF, DOC or DOCX, max 2 MB.</small>
                    <small class="error" id="cv-error"></small>
                </div>

                <div class="textarea-control">
                    <label class="inline">
                        <input type="checkbox" id="agree" name="agree" required aria-describedby="agree-error">
                        I confirm the information above is correct. <span class="req" aria-hidden="true">*</span>
                    </label>
                    <small class="error" id="agree-error"></small>
                </div>

            </div>

            <div class="btn">
                <button type="submit" id="submit-btn" disabled>Apply Now</button>
            </div>
        </form>

    </div>
</main>

<script src="Project-2_Job-Application_From.js"></script>
</body>
</html>
